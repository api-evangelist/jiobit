name: Jiobit
description: >-
  Jiobit is a real-time GPS tracking device company owned by Life360, based in San
  Mateo, California. Its lightweight (18g) wearable tracker is designed for kids,
  pets, seniors, and adults, combining LPWA CatM1 cellular, GPS, WiFi, and BLE for
  location accuracy of 1-50 feet, up to 30 days of battery life, geofence and SOS/911
  emergency alerts, and tamper-proof, government-level encryption. Jiobit is a
  consumer hardware and mobile-app product sold direct-to-consumer with a monthly
  connectivity subscription; it publishes no public developer API, SDK, or developer
  portal. This profile is maintained in the API Evangelist network for company
  discovery and monitoring.
